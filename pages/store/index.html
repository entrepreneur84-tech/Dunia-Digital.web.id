<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<title>Dunia Digital Store</title><style>
body{
  font-family: Arial;
  background:#0f172a;
  color:white;
  margin:0;
}

h1{
  text-align:center;
  padding:30px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:#1e293b;
  border-radius:15px;
  padding:15px;
  text-align:center;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
}

.card img{
  width:100%;
  border-radius:10px;
}

.btn{
  margin-top:10px;
  padding:10px;
  background:#22c55e;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

</style></head><body><h1>📚 Dunia Digital Store</h1><div class="grid" id="produk-list"></div><script>

const produk = [
{nama:"Quantum Zikir", img:"quantum-zikir.png"},
{nama:"The Art of Surrender", img:"the-art-of-surrender.png"},
{nama:"Tauhid Quantum", img:"tauhid-quantum.png"},
{nama:"Quantum Nur", img:"quantum-nur.png"},
{nama:"The Radiance Within", img:"the-radiance-within.png"},
{nama:"Pasrah Itu Zikir", img:"pasrah-itu-dzikir.png"},
{nama:"Zero Points Zikir", img:"titik-nol-dzikir.png"},
{nama:"FIQIH TASAWUF MODERN", img:"fiqih-tasawuf.png"}
];

// 🔥 GANTI PATH DI SINI SESUAI FOLDER KAMU
const BASE_IMG = "assets/img/"; 

const container = document.getElementById("produk-list");

produk.forEach(p => {
  container.innerHTML += `
    <div class="card">
      <img src="${BASE_IMG}${p.img}" alt="${p.nama}">
      <h3>${p.nama}</h3>
      <button class="btn" onclick="beli('${p.nama}')">Beli</button>
    </div>
  `;
});

function beli(nama){
  window.location.href = "https://wa.me/6285175313909?text=Saya ingin beli ebook: " + encodeURIComponent(nama);
}

</script></body>
</html>
