<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toko Ebook Premium</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
}

.header {
  background: #111;
  color: #fff;
  text-align: center;
  padding: 25px;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 30px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
  transition: 0.3s;
  position: relative;
}

.card:hover {
  transform: translateY(-5px);
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.card h3 {
  font-size: 15px;
}

.btn {
  display: inline-block;
  margin-top: 10px;
  padding: 10px;
  background: #007bff;
  color: #fff;
  border-radius: 8px;
  cursor: pointer;
}

.soon {
  background: orange;
}

.badge {
  position: absolute;
  top: 10px;
  left: 10px;
  background: red;
  color: white;
  padding: 5px 8px;
  font-size: 11px;
  border-radius: 6px;
}

.payment-box {
  display: none;
  margin-top: 40px;
  background: #fff;
  padding: 20px;
  border-radius: 10px;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

button {
  margin-top: 10px;
  padding: 12px;
  width: 100%;
  background: green;
  color: white;
  border: none;
  border-radius: 8px;
}

.note {
  font-size: 13px;
  color: #666;
  margin-top: 10px;
}
</style>

</head>
<body>

<div class="header">
  <h2>📚 Ebook Premium Digital</h2>
  <p>Akses instan setelah pembayaran</p>
</div>

<div class="container">

<div class="grid" id="produkList"></div>

<div id="paymentBox" class="payment-box">
<h3 id="produkDipilih"></h3>

<p><b>Transfer ke:</b></p>

<p><b>SeaBank</b><br>
Ahmad Barizi<br>
901981495649</p>

<p><b>Bank Jago</b><br>
Ahmad Barizi<br>
109896731184</p>

<hr>

<input type="text" id="nama" placeholder="Nama kamu">
<input type="text" id="wa" placeholder="Nomor WhatsApp">
<textarea id="bukti" placeholder="Link bukti transfer (opsional)"></textarea>

<button onclick="kirimWA()">Saya sudah bayar</button>

<p class="note">
🔒 Data kamu aman • Tidak ada spam  
⚡ Ebook langsung bisa diakses
</p>

</div>

</div>

<script>
const produk = [
"1 Cara Jitu Berdamai dengan Diri",
"2 The Art of Surrender",
"3 Quantum Zikir",
"4 The Radiance Within",
"5 Rahasia Menemukan Kode Sumber Realitas",
"6 The Dzikir of Supreme Power",
"7 Pasrah Itu Zikir",
"8 Tauhid Quantum",
"9 Quantum Ruh (Qolbu)",
"10 The Untouchable",
"11 Quantum Nur",
"12 Membongkar Potensi Diri Tanpa Batas",
"13 Powerful Dhikr Based Holistic Healing",
"14 Zero Points Zikir",
"15 Membongkar Realitas Hologram",
"16 Navigasi Cahaya",
"17 Ksatria Spiritual",
"18 Menguak Potensi Diri Tanpa Batas",
"19 Quantum Syukur",
"20 Low Of Spiritual Attraction",
"21 Samudra Tanpa Batas",
"22 FIQIH TASAWUF MODERN"
];

const comingSoon = [
"23 Hakikat Quantum Ihsan",
"24 Manunggal",
"25 Rahasia Mengenal Jatidiri"
];

let selectedProduk = "";

const container = document.getElementById("produkList");

// PRODUK READY
produk.forEach((item, i) => {
  container.innerHTML += `
  <div class="card">
    <img src="/asset/img/buku%20elektronik/${i+1}.png">
    <h3>${item}</h3>
    <div class="btn" onclick="beli('${item}')">Beli</div>
  </div>`;
});

// PRODUK COMING SOON
comingSoon.forEach((item, i) => {
  container.innerHTML += `
  <div class="card">
    <div class="badge">COMING SOON</div>
    <img src="/asset/img/buku%20elektronik/${i+23}.png">
    <h3>${item}</h3>
    <div class="btn soon">Segera Hadir</div>
  </div>`;
});

function beli(namaProduk) {
  selectedProduk = namaProduk;
  document.getElementById("produkDipilih").innerText = "Produk: " + namaProduk;
  document.getElementById("paymentBox").style.display = "block";
  window.scrollTo(0, document.body.scrollHeight);
}

function kirimWA() {
  let nama = document.getElementById("nama").value;
  let wa = document.getElementById("wa").value;
  let bukti = document.getElementById("bukti").value;

  let pesan = `Halo Admin,%0A
Saya sudah transfer%0A
Produk: ${selectedProduk}%0A
Nama: ${nama}%0A
WA: ${wa}%0A
Bukti: ${bukti}`;

  window.location.href = "https://wa.me/6385175313909?text=" + pesan;

  setTimeout(() => {
    window.location.href = "/pages/store/success.html";
  }, 2000);
}
</script>

</body>
</html>
