<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dunia Digital Store</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  margin: 0;
  color: #fff;
}

.header {
  text-align: center;
  padding: 25px;
}

.header h1 {
  margin: 0;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
}

.card {
  background: #1e293b;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.card h3 {
  font-size: 14px;
}

.btn {
  margin-top: 10px;
  padding: 10px;
  background: #22c55e;
  border-radius: 8px;
  cursor: pointer;
}

.payment {
  display: none;
  margin-top: 40px;
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  border: none;
}

button {
  margin-top: 10px;
  padding: 12px;
  width: 100%;
  background: #22c55e;
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
}

.note {
  font-size: 13px;
  color: #9ca3af;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="header">
  <h1>DUNIA DIGITAL STORE</h1>
  <p>Ebook Premium • Akses Instan</p>
</div>

<div class="container">

<div class="grid" id="produkList"></div>

<div id="paymentBox" class="payment">
<h3 id="produkDipilih"></h3>

<p><b>Transfer ke:</b></p>

<p>SeaBank<br>
Ahmad Barizi<br>
901981495649</p>

<p>Bank Jago<br>
Ahmad Barizi<br>
109896731184</p>

<hr>

<input type="text" id="nama" placeholder="Nama">
<input type="text" id="wa" placeholder="WhatsApp">
<textarea id="bukti" placeholder="Link bukti transfer (opsional)"></textarea>

<button onclick="kirimWA()">Saya sudah bayar</button>

<p class="note">
🔒 Aman • Tanpa spam  
⚡ Ebook langsung bisa diakses
</p>

</div>

</div>

<script>
const produk = [
{nama:"Cara Jitu Berdamai dengan Diri", img:"cara-jitu-berdamai-dgn-diri.png"},
{nama:"The Art of Surrender", img:"the-art-of-surrender.png"},
{nama:"Quantum Zikir", img:"quantum-zikir.png"},
{nama:"The Radiance Within", img:"the-radiance-within.png"},
{nama:"Rahasia Menemukan Kode Sumber Realitas", img:"rahasia-menemukan-kode.png"},
{nama:"The Dzikir of Supreme Power", img:"the-dzikir-of-supreme-power.png"},
{nama:"Pasrah Itu Zikir", img:"pasrah-itu-dzikir.png"},
{nama:"Tauhid Quantum", img:"tauhid-quantum.png"},
{nama:"Quantum Ruh (Qolbu)", img:"kuantum-ruh.png"},
{nama:"The Untouchable", img:"the-untouchable.png"},
{nama:"Quantum Nur", img:"quantum-nur.png"},
{nama:"Membongkar Potensi Diri Tanpa Batas", img:"membongkar-potensi.png"},
{nama:"Powerful Dhikr Based Holistic Healing", img:"penyembuhan-holistik.png"},
{nama:"Zero Points Zikir", img:"titik-nol-dzikir.png"},
{nama:"Membongkar Realitas Hologram", img:"mengungkap-realitas.png"},
{nama:"Navigasi Cahaya", img:"navigasi-cahaya.png"},
{nama:"Ksatria Spiritual", img:"ksatria-spiritual.png"},
{nama:"Menguak Potensi Diri Tanpa Batas", img:"menguak-potensi.png"},
{nama:"Quantum Syukur", img:"kuantum-syukur.png"},
{nama:"Low Of Spiritual Attraction", img:"low-of-spiritual-attraction.png"},
{nama:"Samudra Tanpa Batas", img:"samudra-tanpa-batas.png"},
{nama:"FIQIH TASAWUF MODERN", img:"fiqih-tasawuf.png"}
];

let selected = "";

const container = document.getElementById("produkList");

produk.forEach((item) => {
  container.innerHTML += `
  <div class="card">
    <img src="/asset/img/buku%20elektronik/${item.img}">
    <h3>${item.nama}</h3>
    <div class="btn" onclick="beli('${item.nama}')">Beli</div>
  </div>`;
});

function beli(nama) {
  selected = nama;
  document.getElementById("produkDipilih").innerText = "Produk: " + nama;
  document.getElementById("paymentBox").style.display = "block";
  window.scrollTo(0, document.body.scrollHeight);
}

function kirimWA() {
  let nama = document.getElementById("nama").value;
  let wa = document.getElementById("wa").value;
  let bukti = document.getElementById("bukti").value;

  let pesan = `Halo Admin,%0A
Saya sudah transfer%0A
Produk: ${selected}%0A
Nama: ${nama}%0A
WA: ${wa}%0A
Bukti: ${bukti}`;

  window.location.href = "https://wa.me/6385175313909?text=" + pesan;

  setTimeout(() => {
    window.location.href = "/pages/store/success.html";
  }, 2000);
}
</script>

</body>
</html>
